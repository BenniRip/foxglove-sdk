# Example parameters for the optional iceoryx2 source (FOXGLOVE_BRIDGE_WITH_IOX2=ON).
#
# Load alongside the bridge, e.g.:
#   ros2 run foxglove_bridge foxglove_bridge --ros-args --params-file iox2_services.example.yaml
#
# Each index across the four parallel arrays defines one bridged service. An empty
# service_names list leaves the iox2 source inert (the bridge then serves only ROS data).
/**:
  ros__parameters:
    iox2:
      # Directory containing the .bfbs (binary FlatBuffer) schema files.
      schema_dir: "/path/to/bfbs"
      # Subscriber poll period in milliseconds.
      poll_interval_ms: 1
      # Whether each sample carries an Iox2MessageHeader. When true (default), the header
      # locates the FlatBuffer within the slot and supplies the publisher's timestamp. When
      # false, the entire payload slice is treated as the FlatBuffer and the bridge's receive
      # time is used as the log time. The header path is a stopgap and is expected to be
      # retired once iceoryx2 ships first-class FlatBuffer support.
      use_message_header: true
      # iceoryx2 user-header type name (header mode only; ignored when use_message_header is
      # false). Leave empty to use the bridge's default contract name, or set it to match your
      # publisher's header type name (so the bridge can attach to publishers that use a
      # different header name without code changes). Must be <= 255 characters; the header's
      # size and alignment must also match the publisher's, not just the name.
      user_header_type_name: ""
      # iox2 publish-subscribe service names to subscribe to.
      service_names: ["/livox/points"]
      # Foxglove topic names to advertise (usually mirrors service_names).
      topics: ["/livox/points"]
      # Foxglove schema names (well-known foxglove.* schemas recommended).
      schema_names: ["foxglove.PointCloud"]
      # .bfbs file (relative to schema_dir) describing each topic's payload.
      bfbs_files: ["PointCloud.bfbs"]
